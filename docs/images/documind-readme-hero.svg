<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">DocuMind Laravel RAG Document Assistant</title>
  <desc id="desc">A portfolio hero image showing the DocuMind Laravel RAG app, its chat interface, Gemini quota tracking, and document retrieval pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 42px; font-weight: 800; fill: #0f172a; letter-spacing: -1px; }
      .subtitle { font-size: 19px; fill: #475569; }
      .small { font-size: 13px; fill: #64748b; }
      .label { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .tealText { fill: #0f766e; }
      .white { fill: #ffffff; }
      .muted { fill: #64748b; }
      .panel { fill: #ffffff; stroke: #dbe7ef; stroke-width: 1.2; }
      .softPanel { fill: #f8fafc; stroke: #dbe7ef; stroke-width: 1; }
      .quotaPanel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .accentStroke { stroke: #14b8a6; stroke-width: 2; }
      .mutedStroke { stroke: #dbe7ef; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <g class="sans">
    <g transform="translate(50 56)">
      <rect width="58" height="58" rx="14" fill="url(#teal)" filter="url(#softShadow)"/>
      <text x="29" y="38" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">D</text>
      <text x="78" y="40" font-size="44" font-weight="800" fill="#0f172a" letter-spacing="-1">DocuMind</text>
      <text x="0" y="122" class="title">Laravel <tspan class="tealText">RAG</tspan></text>
      <text x="0" y="180" class="title">Document Assistant</text>
      <text x="0" y="220" class="subtitle">Upload PDFs, retrieve document context, and answer</text>
      <text x="0" y="249" class="subtitle">questions with source-backed citations.</text>
    </g>

    <g transform="translate(52 350)">
      <g>
        <rect x="0" y="0" width="42" height="42" rx="11" fill="#ecfeff" stroke="#99f6e4"/>
        <path d="M14 26h14M17 14h9l5 5v13H17z" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="58" y="17" class="label">Private PDF Upload</text>
        <text x="58" y="37" class="small">User-owned storage and protected workflows</text>
      </g>
      <g transform="translate(0 70)">
        <rect x="0" y="0" width="42" height="42" rx="11" fill="#ecfeff" stroke="#99f6e4"/>
        <path d="M14 13h14M14 21h14M14 29h10" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
        <text x="58" y="17" class="label">Page-Aware Processing</text>
        <text x="58" y="37" class="small">pdftotext extraction, chunking, page tracking</text>
      </g>
      <g transform="translate(0 140)">
        <rect x="0" y="0" width="42" height="42" rx="11" fill="#ecfeff" stroke="#99f6e4"/>
        <circle cx="21" cy="20" r="9" fill="none" stroke="#0f766e" stroke-width="2"/>
        <path d="M28 27l7 7" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
        <text x="58" y="17" class="label">pgvector Semantic Search</text>
        <text x="58" y="37" class="small">Cosine similarity over Gemini embeddings</text>
      </g>
      <g transform="translate(0 210)">
        <rect x="0" y="0" width="42" height="42" rx="11" fill="#ecfeff" stroke="#99f6e4"/>
        <path d="M13 14h16a6 6 0 0 1 0 12H21l-8 7v-7" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="58" y="17" class="label">Async Chat + Citations</text>
        <text x="58" y="37" class="small">Blade-rendered responses without a SPA</text>
      </g>
    </g>

    <g transform="translate(462 42)" filter="url(#shadow)">
      <rect width="755" height="445" rx="16" class="panel"/>
      <rect width="755" height="54" rx="16" fill="#f8fafc"/>
      <rect y="53" width="755" height="1" fill="#e2e8f0"/>
      <circle cx="28" cy="27" r="6" fill="#ef4444"/>
      <circle cx="48" cy="27" r="6" fill="#f59e0b"/>
      <circle cx="68" cy="27" r="6" fill="#22c55e"/>
      <text x="100" y="32" font-size="15" font-weight="700" fill="#0f172a">DocuMind Chat</text>

      <g transform="translate(24 76)">
        <rect width="160" height="344" fill="#ffffff"/>
        <text x="0" y="19" class="label">Conversations</text>
        <rect x="0" y="42" width="140" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="15" y="64" font-size="12" fill="#94a3b8">Search conversations</text>
        <rect x="0" y="96" width="143" height="73" rx="10" fill="#f0fdfa" stroke="#5eead4"/>
        <text x="14" y="122" font-size="13" font-weight="700" fill="#0f172a">Check Motivation</text>
        <text x="14" y="145" class="small">14 messages</text>
        <rect x="14" y="153" width="82" height="22" rx="11" fill="#f1f5f9"/>
        <text x="25" y="168" font-size="11" fill="#334155">Single doc</text>

        <g transform="translate(0 210)">
          <rect width="160" height="126" rx="10" class="quotaPanel"/>
          <text x="14" y="24" font-size="13" font-weight="700" fill="#0f172a">Gemini limits</text>
          <rect x="110" y="10" width="38" height="22" rx="11" fill="#dcfce7" stroke="#bbf7d0"/>
          <text x="129" y="25" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">Ready</text>
          <text x="14" y="49" font-size="11" fill="#64748b">Chat answers</text>
          <text x="131" y="49" text-anchor="end" font-size="11" font-weight="700" fill="#0f172a">13 left</text>
          <rect x="14" y="58" width="132" height="5" rx="3" fill="#e2e8f0"/>
          <rect x="14" y="58" width="82" height="5" rx="3" fill="#0d9488"/>
          <text x="14" y="80" font-size="10" fill="#64748b">Embeddings</text>
          <text x="132" y="80" text-anchor="end" font-size="10" font-weight="700" fill="#0f172a">993 left</text>
          <rect x="14" y="90" width="132" height="5" rx="3" fill="#e2e8f0"/>
          <rect x="14" y="90" width="128" height="5" rx="3" fill="#0d9488"/>
          <text x="14" y="112" font-size="10" fill="#64748b">Shared free-tier tracking</text>
        </g>
      </g>

      <g transform="translate(210 76)">
        <text x="0" y="17" font-size="11" font-weight="800" fill="#0f766e">DOCUMIND CHAT</text>
        <text x="0" y="44" font-size="20" font-weight="800" fill="#0f172a">Check Motivation</text>
        <rect x="0" y="60" width="100" height="24" rx="12" fill="#ccfbf1" stroke="#99f6e4"/>
        <text x="50" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">Single document</text>
        <rect x="112" y="60" width="112" height="24" rx="12" fill="#f1f5f9"/>
        <text x="168" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">1 selected document</text>
        <rect x="290" y="0" width="235" height="44" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="308" y="28" font-size="12" font-weight="700" fill="#0f172a">View selected documents</text>

        <rect x="0" y="102" width="520" height="244" fill="#f8fafc" stroke="#e2e8f0"/>
        <g transform="translate(330 132)">
          <text x="186" y="-9" text-anchor="end" font-size="11" fill="#475569">You</text>
          <rect x="0" y="0" width="190" height="42" rx="9" fill="#0d9488"/>
          <text x="95" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Summarize this document</text>
        </g>
        <g transform="translate(0 192)">
          <text x="0" y="-10" font-size="11" fill="#475569">Assistant</text>
          <rect x="0" y="0" width="505" height="58" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="18" y="23" font-size="12" fill="#334155">The document highlights motivation, goals, and next steps.</text>
          <text x="18" y="43" font-size="12" fill="#334155">Key points are returned with source-backed citations.</text>
        </g>
        <rect x="0" y="270" width="505" height="36" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
        <text x="20" y="293" font-size="12" font-weight="700" fill="#0f766e">Sources used (2)</text>

        <g transform="translate(0 366)">
          <rect x="0" y="0" width="128" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="64" y="21" text-anchor="middle" font-size="12" fill="#0f172a">Summarize</text>
          <rect x="140" y="0" width="142" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="211" y="21" text-anchor="middle" font-size="12" fill="#0f172a">Key points?</text>
          <rect x="294" y="0" width="176" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="382" y="21" text-anchor="middle" font-size="12" fill="#0f172a">Important deadlines?</text>
          <rect x="0" y="44" width="460" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="16" y="68" font-size="12" fill="#94a3b8">Ask a question about the selected documents</text>
          <rect x="475" y="44" width="46" height="38" rx="9" fill="#0d9488"/>
          <text x="498" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Send</text>
        </g>
      </g>
    </g>

    <g transform="translate(146 598)">
      <g>
        <rect width="132" height="50" rx="10" class="panel" filter="url(#softShadow)"/>
        <text x="66" y="31" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">PDF Upload</text>
      </g>
      <text x="153" y="31" font-size="27" fill="#475569">-></text>
      <g transform="translate(196 0)">
        <rect width="132" height="50" rx="10" class="panel" filter="url(#softShadow)"/>
        <text x="66" y="31" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Chunking</text>
      </g>
      <text x="349" y="31" font-size="27" fill="#475569">-></text>
      <g transform="translate(392 0)">
        <rect width="132" height="50" rx="10" class="panel" filter="url(#softShadow)"/>
        <text x="66" y="31" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Embeddings</text>
      </g>
      <text x="545" y="31" font-size="27" fill="#475569">-></text>
      <g transform="translate(588 0)">
        <rect width="146" height="50" rx="10" class="panel" filter="url(#softShadow)"/>
        <text x="73" y="31" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">pgvector Search</text>
      </g>
      <text x="755" y="31" font-size="27" fill="#475569">-></text>
      <g transform="translate(798 0)">
        <rect width="150" height="50" rx="10" class="panel" filter="url(#softShadow)"/>
        <text x="75" y="31" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Gemini Answers</text>
      </g>
    </g>

    <g transform="translate(318 674)">
      <rect x="0" y="0" width="78" height="28" rx="14" fill="#ffffff" stroke="#dbe7ef"/>
      <text x="39" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Laravel</text>
      <rect x="88" y="0" width="112" height="28" rx="14" fill="#ffffff" stroke="#dbe7ef"/>
      <text x="144" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">PostgreSQL</text>
      <rect x="210" y="0" width="88" height="28" rx="14" fill="#ffffff" stroke="#dbe7ef"/>
      <text x="254" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">pgvector</text>
      <rect x="308" y="0" width="76" height="28" rx="14" fill="#ffffff" stroke="#dbe7ef"/>
      <text x="346" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Gemini</text>
      <rect x="394" y="0" width="66" height="28" rx="14" fill="#ffffff" stroke="#dbe7ef"/>
      <text x="427" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Blade</text>
      <rect x="470" y="0" width="116" height="28" rx="14" fill="#ffffff" stroke="#dbe7ef"/>
      <text x="528" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Tailwind CSS</text>
    </g>
  </g>
</svg>
