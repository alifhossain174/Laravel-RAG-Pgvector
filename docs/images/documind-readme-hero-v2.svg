<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">DocuMind Laravel RAG Document Assistant</title>
  <desc id="desc">Clean portfolio hero image for DocuMind showing Laravel RAG features, a contained chat UI mockup, Gemini quota tracking, and the document intelligence pipeline.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .h1 { font-size: 42px; font-weight: 850; fill: #0f172a; letter-spacing: -1px; }
      .brandText { fill: #0f766e; }
      .body { font-size: 18px; fill: #475569; }
      .small { font-size: 12px; fill: #64748b; }
      .tiny { font-size: 10px; fill: #64748b; }
      .label { font-size: 13px; font-weight: 750; fill: #0f172a; }
      .panel { fill: #ffffff; stroke: #dbe7ef; stroke-width: 1.2; }
      .mutedPanel { fill: #f8fafc; stroke: #dbe7ef; stroke-width: 1.1; }
      .tealPanel { fill: #f0fdfa; stroke: #99f6e4; stroke-width: 1.2; }
      .pill { fill: #f1f5f9; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#pageBg)"/>

  <g class="font">
    <g transform="translate(52 52)">
      <rect width="58" height="58" rx="14" fill="url(#brand)" filter="url(#softShadow)"/>
      <text x="29" y="38" text-anchor="middle" font-size="25" font-weight="850" fill="#ffffff">D</text>
      <text x="76" y="40" font-size="42" font-weight="850" fill="#0f172a" letter-spacing="-1">DocuMind</text>

      <text x="0" y="124" class="h1">Laravel <tspan class="brandText">RAG</tspan></text>
      <text x="0" y="178" class="h1">Document Assistant</text>
      <text x="0" y="221" class="body">Upload PDFs, retrieve document context,</text>
      <text x="0" y="250" class="body">and answer with source citations.</text>
    </g>

    <g transform="translate(52 346)">
      <g>
        <rect x="0" y="0" width="42" height="42" rx="11" fill="#ecfeff" stroke="#99f6e4"/>
        <path d="M14 26h14M17 14h9l5 5v13H17z" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="58" y="17" class="label">Private PDF Upload</text>
        <text x="58" y="37" class="small">User-owned storage and protected workflows</text>
      </g>
      <g transform="translate(0 70)">
        <rect x="0" y="0" width="42" height="42" rx="11" fill="#ecfeff" stroke="#99f6e4"/>
        <path d="M14 13h14M14 21h14M14 29h10" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
        <text x="58" y="17" class="label">Page-Aware Processing</text>
        <text x="58" y="37" class="small">pdftotext extraction, chunking, page tracking</text>
      </g>
      <g transform="translate(0 140)">
        <rect x="0" y="0" width="42" height="42" rx="11" fill="#ecfeff" stroke="#99f6e4"/>
        <circle cx="21" cy="20" r="9" fill="none" stroke="#0f766e" stroke-width="2"/>
        <path d="M28 27l7 7" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
        <text x="58" y="17" class="label">pgvector Search</text>
        <text x="58" y="37" class="small">Semantic retrieval over Gemini embeddings</text>
      </g>
      <g transform="translate(0 210)">
        <rect x="0" y="0" width="42" height="42" rx="11" fill="#ecfeff" stroke="#99f6e4"/>
        <path d="M13 14h16a6 6 0 0 1 0 12H21l-8 7v-7" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="58" y="17" class="label">Async Chat + Citations</text>
        <text x="58" y="37" class="small">Blade-rendered responses without a SPA</text>
      </g>
    </g>

    <g transform="translate(470 48)" filter="url(#cardShadow)">
      <rect width="720" height="545" rx="18" class="panel"/>
      <rect width="720" height="54" rx="18" fill="#f8fafc"/>
      <rect y="53" width="720" height="1" fill="#e2e8f0"/>
      <circle cx="28" cy="27" r="6" fill="#ef4444"/>
      <circle cx="48" cy="27" r="6" fill="#f59e0b"/>
      <circle cx="68" cy="27" r="6" fill="#22c55e"/>
      <text x="100" y="32" font-size="15" font-weight="750" fill="#0f172a">DocuMind Chat</text>

      <g transform="translate(24 78)">
        <rect width="168" height="360" fill="#ffffff"/>
        <text x="0" y="18" class="label">Conversations</text>
        <rect x="0" y="42" width="142" height="34" rx="8" class="mutedPanel"/>
        <text x="14" y="64" font-size="12" fill="#94a3b8">Search conversations</text>
        <rect x="0" y="96" width="150" height="76" rx="10" class="tealPanel"/>
        <text x="14" y="123" font-size="13" font-weight="750" fill="#0f172a">Check Motivation</text>
        <text x="14" y="146" class="small">14 messages</text>
        <rect x="14" y="156" width="82" height="22" rx="11" fill="#f1f5f9"/>
        <text x="25" y="171" font-size="11" fill="#334155">Single doc</text>

        <g transform="translate(0 220)">
          <rect width="160" height="124" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="14" y="24" font-size="13" font-weight="750" fill="#0f172a">Gemini limits</text>
          <rect x="110" y="10" width="38" height="22" rx="11" fill="#dcfce7" stroke="#bbf7d0"/>
          <text x="129" y="25" text-anchor="middle" font-size="10" font-weight="750" fill="#047857">Ready</text>
          <text x="14" y="50" class="tiny">Chat answers</text>
          <text x="132" y="50" text-anchor="end" font-size="10" font-weight="750" fill="#0f172a">13 left</text>
          <rect x="14" y="59" width="132" height="5" rx="3" fill="#e2e8f0"/>
          <rect x="14" y="59" width="83" height="5" rx="3" fill="#0d9488"/>
          <text x="14" y="82" class="tiny">Embeddings</text>
          <text x="132" y="82" text-anchor="end" font-size="10" font-weight="750" fill="#0f172a">993 left</text>
          <rect x="14" y="91" width="132" height="5" rx="3" fill="#e2e8f0"/>
          <rect x="14" y="91" width="128" height="5" rx="3" fill="#0d9488"/>
          <text x="14" y="114" class="tiny">Shared free-tier tracking</text>
        </g>
      </g>

      <g transform="translate(220 78)">
        <text x="0" y="17" font-size="11" font-weight="850" fill="#0f766e">DOCUMIND CHAT</text>
        <text x="0" y="44" font-size="20" font-weight="850" fill="#0f172a">Check Motivation</text>
        <rect x="0" y="60" width="100" height="24" rx="12" fill="#ccfbf1" stroke="#99f6e4"/>
        <text x="50" y="76" text-anchor="middle" font-size="11" font-weight="750" fill="#0f766e">Single document</text>
        <rect x="112" y="60" width="112" height="24" rx="12" fill="#f1f5f9"/>
        <text x="168" y="76" text-anchor="middle" font-size="11" font-weight="750" fill="#334155">1 selected document</text>
        <rect x="288" y="0" width="195" height="44" rx="9" class="mutedPanel"/>
        <text x="306" y="28" font-size="12" font-weight="750" fill="#0f172a">View selected documents</text>

        <rect x="0" y="104" width="485" height="240" fill="#f8fafc" stroke="#e2e8f0"/>
        <g transform="translate(295 132)">
          <text x="186" y="-9" text-anchor="end" font-size="11" fill="#475569">You</text>
          <rect x="0" y="0" width="188" height="42" rx="9" fill="#0d9488"/>
          <text x="94" y="26" text-anchor="middle" font-size="12" font-weight="750" fill="#ffffff">Summarize this document</text>
        </g>
        <g transform="translate(0 192)">
          <text x="0" y="-10" font-size="11" fill="#475569">Assistant</text>
          <rect x="0" y="0" width="470" height="58" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="18" y="23" font-size="12" fill="#334155">The document highlights motivation, goals, and next steps.</text>
          <text x="18" y="43" font-size="12" fill="#334155">Key points return with source-backed citations.</text>
        </g>
        <rect x="0" y="270" width="470" height="36" rx="8" class="tealPanel"/>
        <text x="20" y="293" font-size="12" font-weight="750" fill="#0f766e">Sources used (2)</text>

        <g transform="translate(0 366)">
          <rect x="0" y="0" width="124" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="62" y="21" text-anchor="middle" font-size="12" fill="#0f172a">Summarize</text>
          <rect x="138" y="0" width="136" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="206" y="21" text-anchor="middle" font-size="12" fill="#0f172a">Key points?</text>
          <rect x="288" y="0" width="166" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="371" y="21" text-anchor="middle" font-size="12" fill="#0f172a">Important dates?</text>
          <rect x="0" y="46" width="420" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="16" y="70" font-size="12" fill="#94a3b8">Ask a question about the selected documents</text>
          <rect x="436" y="46" width="48" height="38" rx="9" fill="#0d9488"/>
          <text x="460" y="70" text-anchor="middle" font-size="12" font-weight="750" fill="#ffffff">Send</text>
        </g>
      </g>
    </g>

    <g transform="translate(82 604)">
      <rect x="0" y="0" width="132" height="48" rx="10" class="panel" filter="url(#softShadow)"/>
      <text x="66" y="30" text-anchor="middle" font-size="13" font-weight="850" fill="#0f172a">PDF Upload</text>
      <text x="152" y="30" font-size="25" fill="#475569">-></text>
      <rect x="196" y="0" width="132" height="48" rx="10" class="panel" filter="url(#softShadow)"/>
      <text x="262" y="30" text-anchor="middle" font-size="13" font-weight="850" fill="#0f172a">Chunking</text>
      <text x="348" y="30" font-size="25" fill="#475569">-></text>
      <rect x="392" y="0" width="132" height="48" rx="10" class="panel" filter="url(#softShadow)"/>
      <text x="458" y="30" text-anchor="middle" font-size="13" font-weight="850" fill="#0f172a">Embeddings</text>
      <text x="544" y="30" font-size="25" fill="#475569">-></text>
      <rect x="588" y="0" width="146" height="48" rx="10" class="panel" filter="url(#softShadow)"/>
      <text x="661" y="30" text-anchor="middle" font-size="13" font-weight="850" fill="#0f172a">pgvector Search</text>
      <text x="754" y="30" font-size="25" fill="#475569">-></text>
      <rect x="798" y="0" width="150" height="48" rx="10" class="panel" filter="url(#softShadow)"/>
      <text x="873" y="30" text-anchor="middle" font-size="13" font-weight="850" fill="#0f172a">Gemini Answers</text>
    </g>

    <g transform="translate(330 674)">
      <rect x="0" y="0" width="78" height="28" rx="14" fill="#ffffff" stroke="#dbe7ef"/>
      <text x="39" y="18" text-anchor="middle" font-size="12" font-weight="750" fill="#475569">Laravel</text>
      <rect x="88" y="0" width="112" height="28" rx="14" fill="#ffffff" stroke="#dbe7ef"/>
      <text x="144" y="18" text-anchor="middle" font-size="12" font-weight="750" fill="#475569">PostgreSQL</text>
      <rect x="210" y="0" width="88" height="28" rx="14" fill="#ffffff" stroke="#dbe7ef"/>
      <text x="254" y="18" text-anchor="middle" font-size="12" font-weight="750" fill="#475569">pgvector</text>
      <rect x="308" y="0" width="76" height="28" rx="14" fill="#ffffff" stroke="#dbe7ef"/>
      <text x="346" y="18" text-anchor="middle" font-size="12" font-weight="750" fill="#475569">Gemini</text>
      <rect x="394" y="0" width="66" height="28" rx="14" fill="#ffffff" stroke="#dbe7ef"/>
      <text x="427" y="18" text-anchor="middle" font-size="12" font-weight="750" fill="#475569">Blade</text>
      <rect x="470" y="0" width="116" height="28" rx="14" fill="#ffffff" stroke="#dbe7ef"/>
      <text x="528" y="18" text-anchor="middle" font-size="12" font-weight="750" fill="#475569">Tailwind CSS</text>
    </g>
  </g>
</svg>
